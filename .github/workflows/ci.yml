permissions:
  contents: read
name: CI

on:
  push:
    branches: [ "main", "fix/anime4k-mpv" ]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # 上游写法: 从 secrets 取 base64 的 google-services.json。
      # fork 场景 secrets 不存在 —— 无 secrets 时落一份本地占位配置,
      # Firebase Analytics/Crashlytics 在运行时静默失败, 不影响构建与播放。
      - name: Load Google Services File
        env:
          DATA: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$DATA" ]; then
            echo "$DATA" | base64 -di > app/google-services.json
          else
            echo '::warning::GOOGLE_SERVICES_JSON_BASE64 not set, using placeholder google-services.json'
            cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "han1me-placeholder",
              "storage_bucket": "han1me-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "com.yenaly.han1meviewer" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyPLACEHOLDER-LOCAL-BUILD-ONLY-0000000" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000001",
                  "android_client_info": { "package_name": "com.yenaly.han1meviewer.debug" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyPLACEHOLDER-LOCAL-BUILD-ONLY-0000000" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 上游写法: 解码签名 keystore 到 $HOME/.android/keystore.jks。
      # fork 场景无 secrets —— 缺失时生成一次性 debug keystore 顶替,
      # APK 可安装可运行, 仅签名主体不同; 有 secrets 时行为与上游完全一致。
      - name: Decode keystore
        run: |
          mkdir -p $HOME/.android
          if [ -n "${{ secrets.YOUR_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.YOUR_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
            mv keystore.jks $HOME/.android/keystore.jks
          else
            echo '::warning::YOUR_KEYSTORE_BASE64 not set, generating ephemeral debug keystore'
            keytool -genkeypair -v \
              -keystore $HOME/.android/keystore.jks \
              -storepass han1me -keypass han1me \
              -alias han1me -keyalg RSA -keysize 2048 -validity 36500 \
              -dname "CN=Han1meViewer CI, OU=CI, O=Fork, L=Local, S=Local, C=US"
          fi

      - name: Build and sign APK with Gradle
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.YOUR_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.YOUR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          # 一次性 keystore 兜底时上面三个 secret 均为空, 这里注入兜底口令
          FALLBACK_KEYSTORE_PASSWORD: han1me
          FALLBACK_KEY_ALIAS: han1me
          HA_GITHUB_TOKEN: ${{ secrets.HA_GITHUB_TOKEN }}
          HA1_VERSION_SOURCE: 'ci'

      - name: Upload APK Zip
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
